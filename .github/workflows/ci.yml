name: CI
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: Validate on Windows
    runs-on: ${{ (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","Windows","X64","gugaksignage-ci"]') || 'windows-latest' }}
    timeout-minutes: 30
    steps:
      - name: Verify runner process identity and isolate environment
        if: ${{ runner.environment == 'self-hosted' }}
        shell: powershell
        run: |
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent().Name
          Write-Output "Runner process identity: $identity"
          if ($identity -ne 'NT AUTHORITY\LOCAL SERVICE') {
            throw "The self-hosted job is not running as NT AUTHORITY\LOCAL SERVICE: $identity"
          }

          $isolatedEnvironment = @(
            'TEMP=C:\actions-runners\GugakSignage\_temp',
            'TMP=C:\actions-runners\GugakSignage\_temp',
            'USERPROFILE=C:\actions-runners\GugakSignage\home',
            'HOME=C:\actions-runners\GugakSignage\home',
            'APPDATA=C:\actions-runners\GugakSignage\home\AppData\Roaming',
            'LOCALAPPDATA=C:\actions-runners\GugakSignage\home\AppData\Local',
            'RUNNER_TOOL_CACHE=C:\actions-runners\GugakSignage\_toolcache',
            'NPM_CONFIG_CACHE=C:\actions-runners\GugakSignage\_cache\npm',
            'PLAYWRIGHT_BROWSERS_PATH=C:\actions-runners\GugakSignage\_cache\ms-playwright'
          )
          [IO.File]::AppendAllText($env:GITHUB_ENV, (($isolatedEnvironment -join "`r`n") + "`r`n"), [Text.UTF8Encoding]::new($false))

      - name: Verify isolated runner environment
        if: ${{ runner.environment == 'self-hosted' }}
        shell: powershell
        run: |
          $blockedVariables = @(
            'GH_TOKEN',
            'GITHUB_TOKEN',
            'OPENAI_API_KEY',
            'OPENROUTER_API_KEY',
            'ORCA_AGENT_SESSION_SPAWN_TOKEN',
            'ORCA_USER_DATA_PATH',
            'CODEX_HOME',
            'TOSSPAPERLAB_DATA_ROOT',
            'DBRAINPLUS_PROD_ROOT'
          )
          $leakedVariables = foreach ($name in $blockedVariables) {
            if (-not [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name, 'Process'))) {
              $name
            }
          }
          if ($leakedVariables) {
            throw "Sensitive environment variables are present: $($leakedVariables -join ', ')"
          }

          $runnerRoot = 'C:\actions-runners\GugakSignage'
          $isolatedVariables = @(
            'TEMP',
            'TMP',
            'USERPROFILE',
            'HOME',
            'APPDATA',
            'LOCALAPPDATA',
            'RUNNER_TEMP',
            'RUNNER_TOOL_CACHE',
            'NPM_CONFIG_CACHE',
            'PLAYWRIGHT_BROWSERS_PATH'
          )
          foreach ($name in $isolatedVariables) {
            $value = [Environment]::GetEnvironmentVariable($name, 'Process')
            if ([string]::IsNullOrWhiteSpace($value) -or -not $value.StartsWith("$runnerRoot\", [StringComparison]::OrdinalIgnoreCase)) {
              throw "Environment variable is not isolated under the GugakSignage runner root: $name"
            }
          }

          $expectedHook = Join-Path $runnerRoot 'admission\Assert-TrustedJob.ps1'
          if (-not (Test-Path -LiteralPath $expectedHook -PathType Leaf)) {
            throw 'The repository runner admission hook is missing.'
          }

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify installed admission hook
        if: ${{ runner.environment == 'self-hosted' }}
        shell: powershell
        run: |
          $sourceHook = Join-Path $env:GITHUB_WORKSPACE 'scripts\runner\Assert-TrustedJob.ps1'
          $installedHook = 'C:\actions-runners\GugakSignage\admission\Assert-TrustedJob.ps1'
          $sourceContent = ([IO.File]::ReadAllText($sourceHook)).Replace("`r`n", "`n")
          $installedContent = ([IO.File]::ReadAllText($installedHook)).Replace("`r`n", "`n")
          if (-not [string]::Equals($sourceContent, $installedContent, [StringComparison]::Ordinal)) {
            throw 'The installed runner admission hook does not match the reviewed repository hook.'
          }
      - name: Verify runner service recovery parsing
        shell: powershell
        run: .\scripts\runner\Test-RunnerServiceRecoveryParsing.ps1
      - name: Verify runner control ACLs
        if: ${{ runner.environment == 'self-hosted' }}
        shell: powershell
        run: .\scripts\runner\Assert-RunnerAclPolicy.ps1 -RunnerRoot 'C:\actions-runners\GugakSignage'
      - name: Verify runner service recovery
        if: ${{ runner.environment == 'self-hosted' }}
        shell: powershell
        run: .\scripts\runner\Assert-RunnerServiceRecovery.ps1 -ServiceName 'actions.runner.toxicyou25-afk-GugakSignage.GugakSignage-CI-Win11'
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Install Microsoft Edge for Playwright
        run: npx playwright install msedge
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Unit and API tests
        run: npm test
      - name: Install prototype license audit packages
        run: npm ci --prefix prototype
      - name: Verify dependency license inventory
        run: npm run verify:licenses
      - name: Set up pinned Inno Setup 6.7.3
        shell: powershell
        run: |
          $version = '6.7.3'
          $expectedHash = '9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732'
          $innoRoot = Join-Path $env:LOCALAPPDATA 'Programs\Inno Setup 6'
          $isccPath = Join-Path $innoRoot 'ISCC.exe'
          $needsInstall = -not (Test-Path -LiteralPath $isccPath -PathType Leaf)
          if (-not $needsInstall) { $needsInstall = (Get-Item -LiteralPath $isccPath).VersionInfo.ProductVersion -notlike "$version*" }
          if ($needsInstall) {
            $setupPath = Join-Path $env:RUNNER_TEMP "innosetup-$version.exe"
            Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $setupPath
            $actualHash = (Get-FileHash -LiteralPath $setupPath -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actualHash -ne $expectedHash) { throw "Inno Setup download SHA-256 mismatch: $actualHash" }
            $setupSignature = Get-AuthenticodeSignature -FilePath $setupPath
            if ($setupSignature.Status -ne 'Valid' -or $setupSignature.SignerCertificate.Subject -notmatch 'Pyrsys B\.V\.') {
              throw "Inno Setup download has no valid Pyrsys B.V. Authenticode signature: $($setupSignature.Status)"
            }
            New-Item -ItemType Directory -Path $innoRoot -Force | Out-Null
            $arguments = '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP- /CURRENTUSER /DIR="' + $innoRoot + '"'
            $process = Start-Process -FilePath $setupPath -ArgumentList $arguments -Wait -PassThru -WindowStyle Hidden
            if ($process.ExitCode -ne 0) { throw "Inno Setup installation failed: $($process.ExitCode)" }
          }
          if (-not (Test-Path -LiteralPath $isccPath -PathType Leaf)) { throw "ISCC.exe is missing: $isccPath" }
          $installedVersion = (Get-Item -LiteralPath $isccPath).VersionInfo.ProductVersion
          if ($installedVersion -notlike "$version*") { throw "Unexpected Inno Setup version: $installedVersion" }
          [IO.File]::AppendAllText($env:GITHUB_PATH, "$innoRoot`r`n", [Text.UTF8Encoding]::new($false))
      - name: Validate Windows install script syntax
        shell: powershell
        run: |
          $installerScript = Join-Path $env:GITHUB_WORKSPACE 'installer\install.ps1'
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($installerScript, [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Output ("{0}:{1}: {2} [{3}]" -f $_.Extent.StartLineNumber, $_.Extent.StartColumnNumber, $_.Message, $_.Extent.Text) }
            throw 'Windows install script syntax is invalid.'
          }
      - name: Validate Windows uninstall script syntax
        shell: powershell
        run: |
          $uninstallerScript = Join-Path $env:GITHUB_WORKSPACE 'installer\uninstall.ps1'
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($uninstallerScript, [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Output ("{0}:{1}: {2} [{3}]" -f $_.Extent.StartLineNumber, $_.Extent.StartColumnNumber, $_.Message, $_.Extent.Text) }
            throw 'Windows uninstall script syntax is invalid.'
          }
      - name: Build Windows package and verify payload licenses
        shell: powershell
        run: |
          .\\installer\build-installer.ps1 -SkipInstall
          $setupExe = Join-Path $env:GITHUB_WORKSPACE 'installer\build\inno\GugakSignage-Setup-0.1.0.exe'
          if (-not (Test-Path -LiteralPath $setupExe -PathType Leaf)) {
            throw "Inno Setup 6 did not produce the required setup EXE: $setupExe"
          }
      - name: PoC engine tests
        run: npm test --prefix poc
      - name: Verify first-run flow
        run: npm run verify:first-run
      - name: Verify schedule and offline playback
        if: ${{ success() }}
        run: npm run verify:schedule
      - name: Verify multimonitor administration and playback
        if: ${{ success() }}
        run: npm run verify:multimonitor
      - name: Verify persistent profile service worker update
        if: ${{ success() }}
        run: npm run verify:sw-update
      - name: Verify taskkill captures native errors under Stop
        if: ${{ success() }}
        shell: powershell
        run: .\installer\test-taskkill-native.ps1
      - name: Verify install, upgrade, uninstall, and data preservation
        if: ${{ success() }}
        shell: powershell
        run: .\installer\test-install.ps1 -EvidenceDir .\installer\build\ci-install-evidence
      - name: Verify Inno Setup install, upgrade, uninstall, and data preservation
        if: ${{ success() }}
        shell: powershell
        run: .\installer\test-inno.ps1 -EvidenceDir .\installer\build\ci-inno-evidence
      - name: Upload verification logs and screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: windows-verification-${{ github.run_attempt }}
          path: |
            docs/verification/*.json
            docs/verification/*.txt
            docs/verification/evidence/*.png
            installer/build/ci-install-evidence/*.json
            installer/build/ci-install-evidence/*.txt
            installer/build/ci-inno-evidence/*.json
            installer/build/ci-inno-evidence/*.txt
            installer/build/inno/*.exe
          if-no-files-found: warn
          retention-days: 14

