<!doctype html>
<!-- SPDX-License-Identifier: Apache-2.0 -->
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>오늘의 안내 · 국립부산국악원</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; }
      body {
        min-height: 100vh;
        color: #17334d;
        background:
          radial-gradient(circle at 92% 8%, rgba(195, 158, 104, 0.26), transparent 30%),
          linear-gradient(145deg, #f7f1e5, #e9dfcd);
        font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
        display: grid;
        place-items: center;
        padding: 3vw;
      }
      main {
        width: min(1180px, 100%);
        background: rgba(255, 252, 245, 0.92);
        border: 1px solid #c9b994;
        border-radius: 22px;
        padding: clamp(26px, 4vw, 60px);
        box-shadow: 0 30px 80px rgba(31, 61, 92, 0.14);
      }
      .eyebrow { color: #9a6e36; letter-spacing: 0.3em; font-size: clamp(11px, 1.1vw, 16px); }
      h1 { margin: 12px 0 4px; font-size: clamp(34px, 5vw, 68px); letter-spacing: -0.04em; }
      .sub { margin: 0 0 30px; color: #6b6d6b; font-size: clamp(15px, 1.6vw, 22px); }
      .grid { display: grid; grid-template-columns: 1.15fr 0.85fr; gap: clamp(20px, 3vw, 42px); }
      .card { background: #f4ecdd; border-radius: 16px; padding: clamp(20px, 2.6vw, 34px); }
      .label { color: #9a6e36; font-size: clamp(12px, 1.2vw, 16px); letter-spacing: 0.12em; }
      .value { margin: 8px 0 0; font-size: clamp(20px, 2.3vw, 31px); font-weight: 700; }
      ul { list-style: none; padding: 0; margin: 18px 0 0; }
      li { padding: 14px 0; border-top: 1px solid #dbcbaa; display: flex; gap: 18px; font-size: clamp(14px, 1.45vw, 19px); }
      li:first-child { border-top: 0; }
      time { flex: 0 0 4.4em; color: #8b3827; font-weight: 700; }
      .foot { margin-top: 30px; color: #6b6d6b; font-size: clamp(12px, 1.15vw, 15px); }
      @media (max-width: 700px) { .grid { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <main>
      <div class="eyebrow">NATIONAL GUGAK CENTER BUSAN</div>
      <h1>오늘의 안내</h1>
      <p class="sub">국립부산국악원을 찾아 주신 여러분을 환영합니다.</p>
      <div class="grid">
        <section class="card">
          <span class="label">오늘의 공연</span>
          <p class="value">가을, 국악의 숨결</p>
          <ul>
            <li><time>14:00</time><span>국악 체험 교실 · 연습실</span></li>
            <li><time>17:00</time><span>전통악기 해설 · 로비</span></li>
            <li><time>19:30</time><span>가을, 국악의 숨결 · 예지당</span></li>
          </ul>
        </section>
        <section class="card">
          <span class="label">관람 안내</span>
          <p class="value">오전 9시 — 오후 6시</p>
          <ul>
            <li><span>인포메이션센터 · 1층</span></li>
            <li><span>휴관일 · 매주 월요일</span></li>
            <li><span>공연 예매 · 안내 데스크</span></li>
          </ul>
        </section>
      </div>
      <p class="foot">이 화면은 URL 콘텐츠 재생 예시입니다. 실제 운영 시에는 기관 공지 페이지 주소로 바꿀 수 있습니다.</p>
    </main>
  </body>
</html>
