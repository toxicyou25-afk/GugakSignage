# 첫 설정용 프로필: 호스트의 loopback에만 포트를 게시한다.
# 컨테이너 안에서는 호스트 브라우저 접속이 loopback으로 보이지 않으므로,
# 초기 비밀번호는 `docker compose -f docker-compose.local.yml exec signage npm run admin:change-password`로 바꿉니다.
services:
  signage:
    build: .
    image: gugak-signage:mvp
    init: true
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      HOST: 0.0.0.0
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SESSION_SECRET: ${SESSION_SECRET:-change-this-session-secret-before-use}
      DATA_DIR: /data
      DB_PATH: /data/signage.sqlite
      UPLOAD_DIR: /data/uploads
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-300}
      SEED_SAMPLES: ${SEED_SAMPLES:-true}
    volumes:
      - signage-data:/data
    restart: unless-stopped

volumes:
  signage-data:
